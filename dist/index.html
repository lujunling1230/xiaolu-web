    <!-- 根据 URL 路径在 React 加载前预设置标题，避免加载过程中显示默认标题 -->
    <script>
      (function() {
        const path = window.location.pathname;
        const titles = {
          '/toolbox/recharge': '回血清单',
          '/toolbox/advice': '解忧杂货店',
          '/toolbox/inventory': '物资管家',
          '/toolbox/supplies': '物资管家',
          '/toolbox/quests': '通关清单',
          '/toolbox/answer': '系统调频',
          '/toolbox/travel': '漫游指南',
          '/toolbox/roaming-guide': '漫游指南',
          '/toolbox/games': '解压馆',
          '/toolbox/banling': '伴龄',
          '/music': '时代回响',
          '/healing': '森林疗愈室',
          '/forest': '森林疗愈室',
          '/mickey': '米奇妙妙屋',
        };
        for (const [prefix, title] of Object.entries(titles)) {
          if (path === prefix || path.startsWith(prefix + '/')) {
            document.title = title;
            return;
          }
        }
      })();
    </script>
